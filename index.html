<!doctype html><html lang='pl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Solecko – dziennik brań</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f4f6f3;color:#142016}header{padding:14px 16px;background:#173d2a;color:white}h1{font-size:20px;margin:0}#map{height:58vh;min-height:390px;background:#b9d8ef;position:relative;overflow:hidden;touch-action:manipulation}.lakeSvg{position:absolute;inset:0;width:100%;height:100%}.marker{position:absolute;min-width:34px;max-width:150px;padding:4px 7px;border-radius:9px;background:#d8342a;color:#fff;font-size:11px;line-height:1.15;border:2px solid white;transform:translate(-50%,-50%);box-shadow:0 1px 4px #0005}.fishMarker{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;font-size:34px;padding:5px;min-height:44px;filter:drop-shadow(0 2px 2px #0006)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;align-items:center;justify-content:center}.modal.open{display:flex}.detail{background:white;border-radius:16px;padding:16px;max-width:430px;width:100%;max-height:85vh;overflow:auto}.detail img{width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:#eee}.photoPreview{max-width:140px;max-height:120px;border-radius:10px;margin-top:6px;display:none}.marker b{display:block;font-size:12px}.depthTag{font-size:12px;fill:#173d2a;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}main{padding:12px;display:grid;gap:10px}.card{background:white;border:1px solid #d7ddd7;border-radius:14px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:10px;padding:10px 13px;background:#315f42;color:white}.secondary{background:#e6ece7;color:#173d2a}.danger{background:#9e302b}label{display:grid;gap:4px;flex:1;min-width:130px}input,select,textarea{border:1px solid #bdc8bf;border-radius:9px;padding:10px;background:white}.status{font-size:13px;color:#526057}.entry{padding:10px 0;border-top:1px solid #e1e6e1}.entry:first-child{border-top:0}.small{font-size:12px;color:#657267}.gps{font-variant-numeric:tabular-nums}#voice{background:#8d3c19}.selected{outline:4px solid #ffd75e}@media(min-width:800px){main{grid-template-columns:1fr 1fr}#map{height:65vh}}</style></head><body><header><h1>🎣 Solecko – dziennik brań</h1><div class='small' style='color:#dce9df'>GPS + dyktowanie + własne punkty</div></header>
<div id='map' aria-label='Schemat Jeziora Solecko – stuknij, aby ustawić punkt ręcznie'>
<svg class='lakeSvg' viewBox='0 0 500 760' preserveAspectRatio='none' aria-hidden='true'>
<rect width='500' height='760' fill='#dce9d5'/>
<!-- bardziej zbliżony obrys: długie jezioro N-S, wschodnie zatoki i jedna mała wyspa -->
<path d='M180 18 C132 34 112 78 126 124 C142 174 118 205 128 250 C137 291 110 326 124 371 C136 410 124 452 144 492 C160 525 157 568 181 606 C202 638 210 691 244 727 C268 752 304 742 320 710 C337 677 363 657 387 629 C414 597 423 560 406 526 C391 497 397 468 417 444 C439 418 439 381 420 354 C400 326 408 295 422 267 C439 234 426 201 401 180 C382 164 380 135 389 105 C400 70 377 41 342 28 C296 11 231 5 180 18 Z' fill='#72afe0' stroke='#4d8dbd' stroke-width='4'/>
<!-- duża zatoka SE --> <path d='M350 548 C395 526 447 539 468 575 C477 601 461 627 430 640 C397 654 365 642 342 620 C329 594 333 568 350 548 Z' fill='#72afe0' stroke='#4d8dbd' stroke-width='4'/>
<!-- mała wyspa --> <path d='M246 545 C237 561 239 587 251 600 C260 609 272 603 275 585 C279 564 269 547 258 539 Z' fill='#b8ce93' stroke='#66805b' stroke-width='2'/>
<!-- orientacyjne izobaty -->
<path d='M165 64 C148 126 158 194 151 258 C145 327 151 399 170 459 C186 510 185 575 213 638 C228 671 248 696 268 706' fill='none' stroke='#fff' stroke-width='2' stroke-dasharray='6 5' opacity='.85'/>
<path d='M328 66 C350 128 338 191 353 249 C367 305 347 370 366 427 C379 466 369 506 352 540' fill='none' stroke='#fff' stroke-width='2' stroke-dasharray='6 5' opacity='.85'/>
<path d='M213 93 C195 174 207 246 195 319 C186 383 203 447 221 493' fill='none' stroke='#2d78ad' stroke-width='2' opacity='.8'/>
<path d='M294 88 C314 161 301 233 316 302 C329 365 313 426 296 482' fill='none' stroke='#2d78ad' stroke-width='2' opacity='.8'/>
<text x='133' y='105' class='depthTag'>1–2 m</text><text x='188' y='218' class='depthTag'>3–4 m</text><text x='238' y='352' class='depthTag'>4–5 m</text><text x='292' y='282' class='depthTag'>5–6 m</text><text x='285' y='430' class='depthTag'>do ok. 6,8 m</text><text x='348' y='590' class='depthTag'>1–3 m zatoka</text><text x='222' y='572' class='depthTag'>wyspa</text>
</svg><div id='marks'></div></div>
<main><section class='card'><div class='row'><button id='gps'>📍 Pobierz GPS</button><button id='voice'>🎙️ Dyktuj wpis</button><button id='manual' class='secondary'>👆 Punkt z mapy</button></div><p id='status' class='status'>Na iPhonie otwórz tę stronę przez HTTPS i zezwól na lokalizację oraz mikrofon.</p><form id='form'><div class='row'><label>Typ<select id='type'><option>Branie</option><option>Złowiony szczupak</option><option>Obserwacja</option><option>Bez brania</option></select></label><label>Godzina<input id='time' type='time'></label></div><div class='row'><label>Głębokość (m)<input id='depth' inputmode='decimal' placeholder='2,5'></label><label>Ryba (cm)<input id='size' inputmode='numeric' placeholder='65'></label></div><label>Przynęta<input id='lure' placeholder='np. guma 12 cm, zielona'></label><label>Zdjęcie ryby<input id='photo' type='file' accept='image/*' capture='environment'><img id='photoPreview' class='photoPreview' alt='Podgląd zdjęcia'></label><label>Notatka<textarea id='note' rows='3' placeholder='wiatr, roślinność, sposób prowadzenia…'></textarea></label><div class='small gps' id='coords'>GPS: brak</div><div class='row' style='margin-top:10px'><button type='submit'>Zapisz punkt</button><button type='button' id='export' class='secondary'>Eksport CSV</button></div></form></section><section class='card'><strong>Zapisane punkty</strong><div id='entries'><p class='status'>Brak wpisów.</p></div></section></main><div id='modal' class='modal'><div class='detail'><div id='detailBody'></div><button type='button' id='closeModal' class='secondary' style='margin-top:10px'>Zamknij</button></div></div>
<script>
const $=id=>document.getElementById(id), status=$('status'), map=$('map'), marks=$('marks');let pos=null,mapPos=null,entries=JSON.parse(localStorage.getItem('soleckoEntries')||'[]');$('time').value=new Date().toTimeString().slice(0,5);
function say(t){status.textContent=t}function save(){try{localStorage.setItem('soleckoEntries',JSON.stringify(entries));render()}catch(err){say('Brak miejsca na zapis zdjęcia. Spróbuj mniejszego zdjęcia.')}}
function openDetail(e,i){let b=$('detailBody');b.innerHTML=(e.photo?'<img src="'+e.photo+'" alt="Zdjęcie złowionej ryby">':'')+'<h2>'+(e.type==='Złowiony szczupak'?'🐟 ':'')+esc(e.type)+'</h2><p><b>'+esc(e.date||'')+' '+esc(e.time||'')+'</b></p><p>'+[e.size&&'<b>'+esc(e.size)+' cm</b>',e.depth&&'głębokość '+esc(e.depth)+' m',e.lure&&esc(e.lure)].filter(Boolean).join(' · ')+'</p>'+(e.note?'<p>'+esc(e.note)+'</p>':'')+'<p class="small gps">'+(e.lat?'GPS: '+e.lat.toFixed(6)+', '+e.lon.toFixed(6)+(e.accuracy?' ±'+Math.round(e.accuracy)+' m':''):'bez GPS')+'</p>'; $('modal').classList.add('open')}
function render(){marks.innerHTML='';entries.forEach((e,i)=>{if(e.mapPos){let m=document.createElement('button');if(e.type==='Złowiony szczupak'){m.className='fishMarker';m.textContent='🐟';m.setAttribute('aria-label','Złowiony szczupak, pokaż szczegóły')}else{m.className='marker';m.innerHTML='<b>'+ (i+1)+'. '+esc(e.type)+'</b>'+[e.depth&&e.depth+' m',e.size&&e.size+' cm'].filter(Boolean).map(esc).join(' · ')}m.style.left=e.mapPos.x+'%';m.style.top=e.mapPos.y+'%';m.onclick=ev=>{ev.stopPropagation();openDetail(e,i)};marks.appendChild(m)}});let box=$('entries');if(!entries.length){box.innerHTML='<p class="status">Brak wpisów.</p>';return}box.innerHTML='';entries.slice().reverse().forEach((e,r)=>{let i=entries.length-1-r,d=document.createElement('div');d.className='entry';d.innerHTML='<b>'+(e.type==='Złowiony szczupak'?'🐟 ':'')+(i+1)+'. '+esc(e.type)+'</b> · '+esc(e.time)+'<div>'+[e.size&&e.size+' cm',e.depth&&e.depth+' m',e.lure].filter(Boolean).map(esc).join(' · ')+'</div><div class="small">'+esc(e.note||'')+'</div><div class="small gps">'+(e.lat?e.lat.toFixed(6)+', '+e.lon.toFixed(6):'bez GPS')+'</div><div class="row" style="margin-top:6px"><button class="secondary details">Szczegóły</button><button class="danger delete">Usuń</button></div>';d.querySelector('.details').onclick=()=>openDetail(e,i);d.querySelector('.delete').onclick=()=>{entries.splice(i,1);save()};box.appendChild(d)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('gps').onclick=()=>{if(!navigator.geolocation){say('Ta przeglądarka nie udostępnia GPS.');return}say('Pobieram lokalizację…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};$('coords').textContent='GPS: '+pos.lat.toFixed(6)+', '+pos.lon.toFixed(6)+' (±'+Math.round(pos.acc)+' m)';say('GPS zapisany. Możesz teraz podyktować opis.')},e=>say('Nie udało się pobrać GPS: '+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})};
let manual=false;$('manual').onclick=()=>{manual=true;map.classList.add('selected');say('Stuknij miejsce na schemacie jeziora.')};map.addEventListener('click',e=>{if(!manual)return;let r=map.getBoundingClientRect();mapPos={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};manual=false;map.classList.remove('selected');say('Punkt na mapie ustawiony.')});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('voice').onclick=()=>{if(!SR){say('Dyktowanie w tej przeglądarce nie jest dostępne. Użyj mikrofonu w klawiaturze iPhone w polu Notatka.');return}let rec=new SR();rec.lang='pl-PL';rec.interimResults=false;rec.onstart=()=>say('Słucham… Powiedz np. „branie, szczupak 65 cm, guma 12 cm, głębokość 2,5 metra”.');rec.onerror=e=>say('Błąd mikrofonu: '+e.error);rec.onresult=e=>{let t=e.results[0][0].transcript;$('note').value=t;parseVoice(t);say('Rozpoznałem wpis. Sprawdź pola i zapisz.')};rec.start()};
function parseVoice(t){let s=t.toLowerCase().replace(',','.');if(s.includes('złow')||s.includes('szczupak'))$('type').value='Złowiony szczupak';else if(s.includes('branie'))$('type').value='Branie';let cm=s.match(/(\d{2,3})\s*(cm|centym)/);if(cm)$('size').value=cm[1];let dep=s.match(/(?:głębokość|na)\s*(\d+(?:\.\d+)?)\s*(?:m|metr)/);if(dep)$('depth').value=dep[1];let lure=s.match(/(?:guma|wobler|jerk|obrotówka|wahadłówka)[^,.]*/);if(lure)$('lure').value=lure[0]}
let photoData='';$('photo').onchange=e=>{let file=e.target.files&&e.target.files[0];if(!file){photoData='';$('photoPreview').style.display='none';return}let img=new Image(),reader=new FileReader();reader.onload=ev=>{img.onload=()=>{let max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.72);$('photoPreview').src=photoData;$('photoPreview').style.display='block'};img.src=ev.target.result};reader.readAsDataURL(file)};
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('form').onsubmit=e=>{e.preventDefault();entries.push({type:$('type').value,time:$('time').value,depth:$('depth').value.replace(',','.'),size:$('size').value,lure:$('lure').value.trim(),note:$('note').value.trim(),photo:photoData,lat:pos&&pos.lat,lon:pos&&pos.lon,accuracy:pos&&pos.acc,mapPos,date:new Date().toISOString().slice(0,10)});save();$('depth').value=$('size').value=$('lure').value=$('note').value='';$('photo').value='';$('photoPreview').style.display='none';photoData='';mapPos=null;say('Punkt zapisany.')};
$('export').onclick=()=>{let rows=[['data','czas','typ','lat','lon','dokladnosc_m','glebokosc_m','ryba_cm','przyneta','notatka'],...entries.map(e=>[e.date,e.time,e.type,e.lat||'',e.lon||'',e.accuracy||'',e.depth,e.size,e.lure,e.note])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='solecko-dziennik.csv';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
