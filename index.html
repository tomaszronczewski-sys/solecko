<!doctype html><html lang='pl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Solecko – dziennik brań</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f4f6f3;color:#142016}header{padding:14px 16px;background:#173d2a;color:white}h1{font-size:20px;margin:0}#map{height:58vh;min-height:390px;background:#b9d8ef;position:relative;overflow:hidden;touch-action:manipulation}.lakeSvg{position:absolute;inset:0;width:100%;height:100%}.marker{position:absolute;min-width:34px;max-width:150px;padding:4px 7px;border-radius:9px;background:#d8342a;color:#fff;font-size:11px;line-height:1.15;border:2px solid white;transform:translate(-50%,-50%);box-shadow:0 1px 4px #0005}.fishMarker{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;font-size:21px;padding:2px;min-height:28px;filter:drop-shadow(0 2px 2px #0006)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;align-items:center;justify-content:center}.modal.open{display:flex}.detail{background:white;border-radius:16px;padding:16px;max-width:430px;width:100%;max-height:85vh;overflow:auto}.detail img{width:100%;max-height:330px;object-fit:contain;border-radius:12px;background:#eee}.photoPreview{max-width:140px;max-height:120px;border-radius:10px;margin-top:6px;display:none}.marker b{display:block;font-size:12px}.depthTag{font-size:12px;fill:#173d2a;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}main{padding:12px;display:grid;gap:10px}.card{background:white;border:1px solid #d7ddd7;border-radius:14px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:10px;padding:10px 13px;background:#315f42;color:white}.secondary{background:#e6ece7;color:#173d2a}.danger{background:#9e302b}label{display:grid;gap:4px;flex:1;min-width:130px}input,select,textarea{border:1px solid #bdc8bf;border-radius:9px;padding:10px;background:white}.status{font-size:13px;color:#526057}.entry{padding:10px 0;border-top:1px solid #e1e6e1}.entry:first-child{border-top:0}.small{font-size:12px;color:#657267}.gps{font-variant-numeric:tabular-nums}#voice{background:#8d3c19}.selected{outline:4px solid #ffd75e}@media(min-width:800px){main{grid-template-columns:1fr 1fr}#map{height:65vh}}</style>
<style id="tile-ui">
.card{box-shadow:0 5px 18px rgba(20,32,22,.08);border:0!important}
.row button{flex:1;min-width:125px;font-weight:700;box-shadow:0 2px 7px rgba(20,32,22,.12);transition:transform .12s ease,box-shadow .12s ease}
.row button:active{transform:scale(.97);box-shadow:0 1px 3px rgba(20,32,22,.12)}
form label{background:#f7f9f7;border:1px solid #e1e7e2;border-radius:13px;padding:9px 10px;margin-top:7px}
form .row label{margin-top:7px}
input,select,textarea{box-sizing:border-box;width:100%;border-color:#d5ddd6!important;box-shadow:inset 0 1px 2px rgba(20,32,22,.04)}
#coords{background:#eef4ef;border-radius:10px;padding:9px 10px;margin-top:8px}
.entry{margin-top:9px;padding:11px!important;background:#f7f9f7;border:1px solid #e1e7e2!important;border-radius:12px}
</style>

<style id="map-zoom-spots">
#map{touch-action:none}
.lakeSvg,#marks{transform-origin:50% 50%;transition:transform .12s ease}
#mapControls{position:absolute;right:10px;top:10px;z-index:8;display:grid;gap:6px}
#mapControls button{width:46px;height:46px;min-height:46px;padding:0;border-radius:12px;font-size:23px;font-weight:800;background:rgba(23,61,42,.92);box-shadow:0 2px 7px #0004}
#zoomLabel{background:#fff;color:#173d2a;border-radius:9px;padding:4px 6px;font-size:11px;font-weight:800;text-align:center;box-shadow:0 1px 4px #0003}


</style>

<script>
const $=id=>document.getElementById(id), status=$('status'), map=$('map'), marks=$('marks');let pos=null,mapPos=null,entries=JSON.parse(localStorage.getItem('soleckoEntries')||'[]');$('time').value=new Date().toTimeString().slice(0,5);
function say(t){status.textContent=t}function save(){try{localStorage.setItem('soleckoEntries',JSON.stringify(entries));render()}catch(err){say('Brak miejsca na zapis zdjęcia. Spróbuj mniejszego zdjęcia.')}}
function openDetail(e,i){let b=$('detailBody');b.innerHTML=(e.photo?'<img src="'+e.photo+'" alt="Zdjęcie złowionej ryby">':'')+'<h2>'+(e.type==='Złowione'||e.type==='Złowiony szczupak'?'🐟 ':'')+esc(e.type)+(e.species?' – '+esc(e.species):'')+'</h2><p><b>'+esc(e.date||'')+' '+esc(e.time||'')+'</b></p><p>'+[e.size&&'<b>'+esc(e.size)+' cm</b>',e.depth&&'głębokość '+esc(e.depth)+' m',e.lure&&esc(e.lure)].filter(Boolean).join(' · ')+'</p>'+(e.note?'<p>'+esc(e.note)+'</p>':'')+'<p class="small gps">'+(e.lat?'GPS: '+e.lat.toFixed(6)+', '+e.lon.toFixed(6)+(e.accuracy?' ±'+Math.round(e.accuracy)+' m':''):'bez GPS')+'</p>'+(e.lat&&e.lon?'<p><a href="https://maps.apple.com/?daddr='+e.lat+','+e.lon+'&dirflg=d" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#315f42;color:white;padding:12px 14px;border-radius:10px;font-weight:700">🧭 Nawiguj do miejsca</a></p>':''); $('modal').classList.add('open')}
function render(){marks.innerHTML='';entries.forEach((e,i)=>{if((e.type==='Złowione'||e.type==='Złowiony szczupak')&&e.mapPos){let m=document.createElement('button');if(e.type==='Złowione'||e.type==='Złowiony szczupak'){m.className='fishMarker';m.textContent='🐟';m.setAttribute('aria-label','Złowiona ryba, pokaż szczegóły')}else{m.className='marker';m.innerHTML='<b>'+ (i+1)+'. '+esc(e.type)+'</b>'+[e.depth&&e.depth+' m',e.size&&e.size+' cm'].filter(Boolean).map(esc).join(' · ')}m.style.left=e.mapPos.x+'%';m.style.top=e.mapPos.y+'%';m.onclick=ev=>{ev.stopPropagation();openDetail(e,i)};marks.appendChild(m)}});let box=$('entries');if(!entries.length){box.innerHTML='<p class="status">Brak wpisów.</p>';return}box.innerHTML='';entries.map((e,i)=>({e,i})).filter(o=>o.e.type==='Złowione'||o.e.type==='Złowiony szczupak').reverse().forEach((o,r)=>{let e=o.e,i=o.i;let d=document.createElement('div');d.className='entry';d.innerHTML='<b>'+(e.type==='Złowione'||e.type==='Złowiony szczupak'?'🐟 ':'')+(i+1)+'. '+esc(e.type)+(e.species?' – '+esc(e.species):'')+'</b> · '+esc(e.time)+'<div>'+[e.size&&e.size+' cm',e.depth&&e.depth+' m',e.lure].filter(Boolean).map(esc).join(' · ')+'</div><div class="small">'+esc(e.note||'')+'</div><div class="small gps">'+(e.lat?e.lat.toFixed(6)+', '+e.lon.toFixed(6):'bez GPS')+'</div><div class="row" style="margin-top:6px"><button class="secondary details">Szczegóły</button>'+(e.lat&&e.lon?'<button class="navigate">🧭 Nawiguj do ryby</button>':'')+'<button class="danger delete">Usuń</button></div>';d.querySelector('.details').onclick=()=>openDetail(e,i);let nav=d.querySelector('.navigate');if(nav)nav.onclick=()=>{window.open('https://maps.apple.com/?daddr='+e.lat+','+e.lon+'&dirflg=d','_blank')};d.querySelector('.delete').onclick=()=>{entries.splice(i,1);save()};box.appendChild(d)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('gps').onclick=()=>{if(!navigator.geolocation){say('Ta przeglądarka nie udostępnia GPS.');return}say('Pobieram lokalizację…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};$('coords').textContent='GPS: '+pos.lat.toFixed(6)+', '+pos.lon.toFixed(6)+' (±'+Math.round(pos.acc)+' m)';say('GPS zapisany. Możesz teraz podyktować opis.')},e=>say('Nie udało się pobrać GPS: '+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})};
let manual=false;$('manual').onclick=()=>{manual=true;map.classList.add('selected');say('Stuknij miejsce na schemacie jeziora.')};map.addEventListener('click',e=>{if(!manual)return;let r=map.getBoundingClientRect();mapPos={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};manual=false;map.classList.remove('selected');say('Punkt na mapie ustawiony.')});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('voice').onclick=()=>{if(!SR){say('Dyktowanie w tej przeglądarce nie jest dostępne. Użyj mikrofonu w klawiaturze iPhone w polu Notatka.');return}let rec=new SR();rec.lang='pl-PL';rec.interimResults=false;rec.onstart=()=>say('Słucham… Powiedz np. „branie, szczupak 65 cm, guma 12 cm, głębokość 2,5 metra”.');rec.onerror=e=>say('Błąd mikrofonu: '+e.error);rec.onresult=e=>{let t=e.results[0][0].transcript;$('note').value=t;parseVoice(t);say('Rozpoznałem wpis. Sprawdź pola i zapisz.')};rec.start()};
function parseVoice(t){let s=t.toLowerCase().replace(',','.');let fish=[['szczupak','Szczupak'],['okoń','Okoń'],['sandacz','Sandacz'],['sum','Sum'],['leszcz','Leszcz'],['płoć','Płoć'],['lin','Lin'],['karaś','Karaś'],['karp','Karp'],['węgorz','Węgorz'],['amur','Amur']];for(let f of fish){if(s.includes(f[0])){$('species').value=f[1];break;}}let cm=s.match(/(\d{2,3})\s*(cm|centym)/);if(cm)$('size').value=cm[1];let dep=s.match(/(?:głębokość|na)\s*(\d+(?:\.\d+)?)\s*(?:m|metr)/);if(dep)$('depth').value=dep[1];let lure=s.match(/(?:guma|wobler|jerk|obrotówka|wahadłówka)[^,.]*/);if(lure)$('lure').value=lure[0]}
let photoData='';$('photo').onchange=e=>{let file=e.target.files&&e.target.files[0];if(!file){photoData='';$('photoPreview').style.display='none';return}let img=new Image(),reader=new FileReader();reader.onload=ev=>{img.onload=()=>{let max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.72);$('photoPreview').src=photoData;$('photoPreview').style.display='block'};img.src=ev.target.result};reader.readAsDataURL(file)};
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('form').onsubmit=e=>{e.preventDefault();entries.push({type:'Złowione',species:$('species').value,time:$('time').value,depth:$('depth').value.replace(',','.'),size:$('size').value,lure:$('lure').value.trim(),note:$('note').value.trim(),photo:photoData,lat:pos&&pos.lat,lon:pos&&pos.lon,accuracy:pos&&pos.acc,mapPos,date:new Date().toISOString().slice(0,10)});save();$('depth').value=$('size').value=$('lure').value=$('note').value='';$('species').value='';$('photo').value='';$('photoPreview').style.display='none';photoData='';mapPos=null;say('Punkt zapisany.')};
$('export').onclick=()=>{let rows=[['data','czas','typ','gatunek','lat','lon','dokladnosc_m','glebokosc_m','ryba_cm','przyneta','notatka'],...entries.map(e=>[e.date,e.time,e.type,e.species||'',e.lat||'',e.lon||'',e.accuracy||'',e.depth,e.size,e.lure,e.note])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='solecko-dziennik.csv';a.click();URL.revokeObjectURL(a.href)};
let mapZoom=1,mapPanX=0,mapPanY=0;
const lakeSvg=document.querySelector('.lakeSvg');
function applyMapTransform(){
 const tr=`translate(${mapPanX}px,${mapPanY}px) scale(${mapZoom})`;
 lakeSvg.style.transform=tr; marks.style.transform=tr;
 $('zoomLabel').textContent=Math.round(mapZoom*100)+'%';
}
$('zoomIn').onclick=e=>{e.stopPropagation();mapZoom=Math.min(4,mapZoom+.35);applyMapTransform()};
$('zoomOut').onclick=e=>{e.stopPropagation();mapZoom=Math.max(1,mapZoom-.35);if(mapZoom===1){mapPanX=mapPanY=0}applyMapTransform()};
$('zoomReset').onclick=e=>{e.stopPropagation();mapZoom=1;mapPanX=mapPanY=0;applyMapTransform()};
let dragStart=null;
map.addEventListener('pointerdown',e=>{if(mapZoom<=1||e.target.closest('#mapControls'))return;dragStart={x:e.clientX,y:e.clientY,px:mapPanX,py:mapPanY};map.setPointerCapture(e.pointerId)});
map.addEventListener('pointermove',e=>{if(!dragStart)return;mapPanX=dragStart.px+(e.clientX-dragStart.x);mapPanY=dragStart.py+(e.clientY-dragStart.y);applyMapTransform()});
map.addEventListener('pointerup',()=>dragStart=null);
map.addEventListener('pointercancel',()=>dragStart=null);
map.addEventListener('wheel',e=>{e.preventDefault();mapZoom=Math.max(1,Math.min(4,mapZoom+(e.deltaY<0?.2:-.2)));applyMapTransform()},{passive:false});



const BGKEY='soleckoMapBackground';
function setMapBackground(mode){
 if(mode==='photo'){map.classList.add('photoBg');localStorage.setItem(BGKEY,'photo');say('Ustawiono zdjęcie jako tło mapy.');}
 else{map.classList.remove('photoBg');localStorage.setItem(BGKEY,'default');say('Ustawiono tło schematyczne.');}
}
$('bgPhoto').onclick=()=>setMapBackground('photo');
$('bgDefault').onclick=()=>setMapBackground('default');
if(localStorage.getItem(BGKEY)==='photo')map.classList.add('photoBg');

render();applyMapTransform();
</script></body></html>
